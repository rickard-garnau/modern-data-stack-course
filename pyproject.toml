[project]
name = "modern-data-stack-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rickard Garnau", email = "rickardgarnau@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.12.5",
    "dbt-snowflake>=1.12.1",
    "dlt[parquet,snowflake]>=1.30.0",
    "ipykernel>=7.3.0",
    "pandas>=3.0.5",
]

[project.scripts]
modern-data-stack-course = "modern_data_stack_course:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "code_along/06_dwh_csv_load",
]
